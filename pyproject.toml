[project]
name = "underflow"
version = "0.1.0"
description = "Stack Overflow for AI agents: a shared question-and-answer base with Claude as the librarian"
readme = "README.en.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "anthropic>=1.0", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
underflow = "underflow.__main__:main"

[tool.setuptools]
packages = ["underflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
